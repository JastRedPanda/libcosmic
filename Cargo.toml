[package]
name = "libcosmic"
version = "1.0.0"
edition = "2024"
rust-version = "1.93"

[lib]
name = "cosmic"

[features]
default = [
    "winit",
    "tokio",
    "a11y",
    "dbus-config",
    "x11",
    "wayland",
    "multi-window",
]
advanced-shaping = ["iced/advanced-shaping"]
# Accessibility support
a11y = ["iced/a11y", "iced_accessibility"]
# Enable about widget and the framework managed About window
about = ["process"]
# Builds support for animated images
animated-image = [
    "dep:async-fs",
    "image/gif",
    "image/webp",
    "image/png",
    "tokio?/io-util",
    "tokio?/fs",
]
# XXX autosize should not be used on winit windows unless dialogs
autosize = []
applet = [
    "autosize",
    "winit",
    "wayland",
    "tokio",
    "cosmic-panel-config",
    "ron",
    "multi-window",
]
applet-token = ["applet"]
# Use the cosmic-settings-daemon for config handling on Linux targets
dbus-config = []
# Debug features
debug = ["iced/debug"]
# Enables pipewire support in ashpd, if ashpd is enabled
pipewire = ["ashpd?/pipewire"]
# Enables process spawning helper
process = ["dep:libc", "dep:rustix"]
# Use rfd for file dialogs
rfd = ["dep:rfd"]
# Enables desktop files helpers
desktop = [
    "process",
    "dep:cosmic-settings-config",
    "dep:freedesktop-desktop-entry",
    "dep:image-extras",
    "dep:mime",
    "dep:shlex",
    "tokio?/io-util",
    "tokio?/net",
]
# Enables launching desktop files inside systemd scopes
desktop-systemd-scope = ["desktop", "dep:zbus"]
# Enables keycode serialization
serde-keycode = ["iced_core/serde"]
# Prevents multiple separate process instances.
single-instance = ["iced_winit/single-instance", "zbus/blocking-api", "ron"]
# smol async runtime
smol = ["dep:smol", "iced/smol", "zbus?/async-io", "rfd?/async-std"]
# Tokio async runtime
tokio = [
    "dep:tokio",
    "ashpd?/tokio",
    "iced/tokio",
    "rfd?/tokio",
    "zbus?/tokio",
    "cosmic-config/tokio",
]
# Wayland window support
wayland = [
    "autosize",
    "surface-message",
    "cctk",
    "multi-window",
    "winit",
    "ashpd?/wayland",
    "iced/wayland",
    "iced_winit/wayland",
    "iced_runtime/wayland",
    "iced_wgpu/wayland",
]
surface-message = []
# multi-window support
multi-window = []
# Render with wgpu
wgpu = ["iced/wgpu", "iced_wgpu"]
# X11 window support via winit
winit = ["iced/winit", "iced_winit"]
winit_debug = ["winit", "debug"]
winit_tokio = ["winit", "tokio"]
winit_wgpu = ["winit", "wgpu"]
# Enables XDG portal integrations
xdg-portal = ["ashpd"]
qr_code = ["iced/qr_code"]
markdown = ["iced/markdown"]
highlighter = ["iced/highlighter"]
async-std = [
    "dep:async-std",
    "ashpd?/async-std",
    "rfd?/async-std",
    "zbus?/async-io",
    "iced/async-std",
]
x11 = ["iced/x11", "iced_winit/x11"]

[dependencies]
apply = "0.3.0"
async-fs = { version = "2.2", optional = true }
async-std = { workspace = true, optional = true }
auto_enums = "0.8.8"
jiff = "0.2"
cosmic-config = { path = "cosmic-config" }
cosmic-settings-config = { path = "../wmde-settings-daemon/config", optional = true }
# Internationalization
i18n-embed = { version = "0.16.0", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
rust-embed = "8.11.0"
css-color = "0.2.8"
derive_setters = "0.1.9"
futures = "0.3"
image = { version = "0.25.10", default-features = false, features = [
    "ico",
    "jpeg",
    "png",
] }
image-extras = { version = "0.1.0", default-features = false, features = [
    "xpm",
    "xbm",
], optional = true }
libc = { version = "0.2.186", optional = true }
log = "0.4"
mime = { version = "0.3.17", optional = true }
palette.workspace = true
rfd = { version = "0.16.0", default-features = false, features = [
    "xdg-portal",
], optional = true }
rustix = { version = "1.1", features = ["pipe", "process"], optional = true }
serde = { workspace = true, features = ["derive"] }
slotmap = "1.1.1"
smol = { version = "2.0.2", optional = true }
thiserror.workspace = true
taffy = { version = "0.9.2", features = ["grid"] }
tokio = { workspace = true, optional = true }
tracing.workspace = true
unicode-segmentation = "1.13"
url = "2.5.8"
zbus = { workspace = true, optional = true }
float-cmp = "0.10.0"
ron = { workspace = true, optional = true }
enumflags2 = "0.7.12"
roxmltree = "0.20"

# Enable DBus feature on Linux targets
[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_vendor = "apple"))))'.dependencies]
cctk = { git = "https://github.com/pop-os/cosmic-protocols", package = "cosmic-client-toolkit", rev = "c0cff4d", optional = true }
cosmic-config = { path = "cosmic-config", features = ["dbus"] }
cosmic-settings-daemon = { path = "../wmde-dbus-settings-bindings/cosmic-settings-daemon" }
zbus.workspace = true
ashpd = { version = "0.12.3", default-features = false, optional = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
freedesktop-icons = { package = "cosmic-freedesktop-icons", git = "https://github.com/pop-os/freedesktop-icons" }
freedesktop-desktop-entry = { version = "0.8.1", optional = true }
shlex = { version = "1.3.0", optional = true }

[target.'cfg(any(not(unix), target_os = "macos"))'.dependencies]
# Used to embed bundled icons for non-unix platforms.
phf = { version = "0.13.1", features = ["macros"] }

[dependencies.cosmic-theme]
path = "cosmic-theme"

[dependencies.iced]
path = "./iced"
default-features = false
features = [
    "advanced",
    "image-without-codecs",
    "lazy",
    "svg",
    "web-colors",
    "tiny-skia",
]

[dependencies.iced_runtime]
path = "./iced/runtime"

[dependencies.iced_renderer]
path = "./iced/renderer"

[dependencies.iced_core]
path = "./iced/core"
features = ["serde"]

[dependencies.iced_widget]
path = "./iced/widget"
features = ["canvas"]

[dependencies.iced_futures]
path = "./iced/futures"

[dependencies.iced_accessibility]
path = "./iced/accessibility"
optional = true

[dependencies.iced_tiny_skia]
path = "./iced/tiny_skia"

[dependencies.iced_winit]
path = "./iced/winit"
optional = true

[dependencies.iced_wgpu]
path = "./iced/wgpu"
optional = true

[dependencies.cosmic-panel-config]
git = "https://github.com/pop-os/cosmic-panel"
# path = "../cosmic-panel/cosmic-panel-config"
optional = true

# WMDE: libcosmic patches its own crates to the local paths, exactly as every consumer does.
# The optional `cosmic-panel-config` dependency comes from pop-os/cosmic-panel by git, and it
# depends on cosmic-config from pop-os/libcosmic by git - so without this table, resolving this
# workspace pulls a SECOND cosmic-config and the iced crates under it from a pre-1.3 rev.
#
# ONE table per source: cargo folds .../libcosmic, .../libcosmic/ and .../libcosmic.git into a
# single source and does not merge separate tables for it - the later one wins and the crates
# listed only in the earlier one go upstream silently.
#
# libcosmic itself is deliberately absent here: nothing in this graph asks for it by git, and a
# patch pointing a package at itself is not a thing cargo accepts. Entries are added as upstream
# starts pulling more crates through that source; an entry nothing uses only earns a warning.
[patch."https://github.com/pop-os/libcosmic"]
cosmic-config = { path = "./cosmic-config" }
cosmic-config-derive = { path = "./cosmic-config-derive" }
iced_core = { path = "./iced/core" }
iced_futures = { path = "./iced/futures" }

[workspace]
members = [
    "cosmic-config",
    "cosmic-config-derive",
    "cosmic-theme",
    "examples/*",
]
# WMDE: examples/cosmic is out of the workspace. It is the only example with a git
# dependency (cosmic-time), and cosmic-time depends on libcosmic by git - so resolving this
# workspace dragged a SECOND libcosmic, cosmic-config, cosmic-theme and the whole iced tree
# into Cargo.lock, pinned at a pre-1.3 rev. Nothing shipped was affected (consumers resolve
# libcosmic through their own lock), but every cargo run in this fork built a stale toolkit
# alongside the real one. The example itself stays on disk and still builds on its own.
exclude = ["iced", "examples/cosmic"]

[workspace.dependencies]
async-std = "1.13"
dirs = "6.0"
palette = "0.7"
ron = "0.12"
serde = "1.0"
thiserror = "2.0"
tracing = "0.1"
tokio = "1.52"
zbus = { version = "5.15", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[workspace.package]
edition = "2024"

[build-dependencies]
build_helpers = { path = "./iced/build_helpers" }
